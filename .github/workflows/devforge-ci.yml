name: DevForge CI

on:
  pull_request:
    branches:
      - main
      - fix/live-preview-persistence-orchestration
  push:
    branches:
      - fix/devforge-fullstack-agent-runtime

permissions:
  contents: read

concurrency:
  group: devforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Unit and integration test suite
        run: npm test

      - name: Production frontend and server build
        run: npm run build
